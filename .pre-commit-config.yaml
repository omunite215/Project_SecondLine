# OM-01: secrets scan + line hygiene. `make bootstrap` installs the hook; `make lint` runs it on every file.
# docs/spec/ is generated by scripts/split_spec.py and checked byte-for-byte against MASTER_SPEC.md.
exclude: ^docs/spec/
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd|ps1)$  # CRLF by .gitattributes
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
