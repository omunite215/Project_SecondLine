# Second-Line local platform (OM-01). Profiles: core · app · events · obs · ui · chaos.
# `make up PROFILES="core app"`; secrets only from ../../.env (make bootstrap). Host ports bind to 127.0.0.1.
name: secondline

services:
  postgres:
    image: postgres:17.11-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run make bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap}
      LEDGER_SVC_PASSWORD: ${LEDGER_SVC_PASSWORD:?run make bootstrap}
      GRADER_SVC_PASSWORD: ${GRADER_SVC_PASSWORD:?run make bootstrap}
      OPERATOR_SVC_PASSWORD: ${OPERATOR_SVC_PASSWORD:?run make bootstrap}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  opa:
    image: openpolicyagent/opa:1.21.4-static
    profiles: [core]
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level", "error"]
    ports: ["127.0.0.1:8181:8181"]
    mem_limit: 128m
    healthcheck:
      # Static image: no shell or curl. Process check here; server readiness is asserted from the host
      # (tests/infra test_OM_01_opa_health).
      test: ["CMD", "/opa", "version"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- app: Java services (mcp-adapter joins in OM-06). No depends_on yet: the skeletons don't use the DB;
  # OM-02 adds `depends_on: postgres` together with the datasource.
  ledger:
    build: {context: ../.., dockerfile: services/ledger/Dockerfile}
    image: secondline/ledger:dev
    pull_policy: build
    profiles: [app]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+ExitOnOutOfMemoryError"
    ports: ["127.0.0.1:8081:8081"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40

  gateway:
    build: {context: ../.., dockerfile: services/gateway/Dockerfile}
    image: secondline/gateway:dev
    pull_policy: build
    profiles: [app]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+ExitOnOutOfMemoryError"
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40

  # ---- events: Kafka, single-node KRaft (the supervisor joins in its KG card).
  kafka:
    image: apache/kafka:4.4.0
    profiles: [events]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports: ["127.0.0.1:9092:9092"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---- obs: OTel collector → Jaeger + Prometheus → Grafana (OM-17 extends).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: [obs]
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes: ["../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    mem_limit: 256m
    healthcheck:
      # Distroless: process check here; readiness from the host via 127.0.0.1:13133 (CI stack job).
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [obs]
    ports: ["127.0.0.1:16686:16686"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [obs]
    volumes: ["../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.4.14
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make bootstrap}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- chaos: Toxiproxy in front of postgres/redis (OM-18 adds the fault matrix).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    profiles: [chaos]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["../toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["127.0.0.1:8474:8474"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
