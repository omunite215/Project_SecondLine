# Gitleaks config (OM-01 pre-commit + CI lint). Default rules stay on; this only allowlists one exact line shape.
[extend]
useDefault = true

[[allowlists]]
description = "Contract examples: an idempotency_key is a random request UUID (ADR-011), not a secret"
regexTarget = "line"
regexes = ['''"idempotency_key":\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''']
