name: claude-review
# Optional AI first-pass review (uses Om's Claude usage). Runs only when Om adds the `ai-review` label.
# Setup: docs/setup/GITHUB.md §5 (Claude GitHub App + secret CLAUDE_CODE_OAUTH_TOKEN).
# pull_request_target: this file and its label check always come from protected main, so a PR can't edit
# them to reach the secret. Never add `ref:` to the checkout below (that would run PR code with secrets).
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
jobs:
  review:
    if: github.event.label.name == 'ai-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
