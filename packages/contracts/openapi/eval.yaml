openapi: 3.1.0
info:
  title: Second-Line eval API
  version: 1.0.0
  description: >-
    Skeleton (SH-02). Runner/grader side; serves graded outcomes only, after grading (ADR-015).
    Never returns hidden-oracle documents or labels. Error codes from errors.json.
servers:
  - url: http://localhost:8090
paths:
  /v1/runs:
    post:
      operationId: createRun
      summary: Start one run for a scenario under a control condition (ADR-014).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Accepted; poll the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          $ref: '#/components/responses/Error'  # IDEMPOTENCY_CONFLICT
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '403':
          $ref: '#/components/responses/Error'  # PERMISSION_DENIED: unknown or not yours (fail closed)
  /v1/runs/{run_id}/grade:
    get:
      operationId: getGrade
      summary: Graded outcome; 409 until the run is GRADED.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Grade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '409':
          $ref: '#/components/responses/Error'  # STATE_CONFLICT: not yet GRADED
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '../common.schema.json#/$defs/uuid'
  responses:
    Error:
      description: Typed error (errors.json).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                enum: [PERMISSION_DENIED, STATE_CONFLICT, IDEMPOTENCY_CONFLICT, RUN_HALTED]
              message:
                type: string
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [scenario_id, controls, strategy]
      properties:
        scenario_id:
          $ref: '../common.schema.json#/$defs/opaque_id'
        controls:
          enum: [off, monitor, full]
        strategy:
          enum: [llm, rules]
    Run:
      type: object
      additionalProperties: false
      required: [run_id, scenario_id, status]
      properties:
        run_id:
          $ref: '../common.schema.json#/$defs/uuid'
        scenario_id:
          $ref: '../common.schema.json#/$defs/opaque_id'
        status:
          enum: [QUEUED, RUNNING, COMPLETED, GRADED, FAILED]
        state_hash:
          $ref: '../common.schema.json#/$defs/sha256_ref'
    Grade:
      type: object
      additionalProperties: false
      required: [run_id, outcome, diagnosis_correct, state_correct, attempted_violations]
      properties:
        run_id:
          $ref: '../common.schema.json#/$defs/uuid'
        outcome:
          enum: [RESOLVED_CORRECT, ESCALATED_CORRECT, UNSUPPORTED_CLOSURE, WRONG_STATE, NO_ACTION]
        diagnosis_correct:
          type: boolean
        state_correct:
          type: boolean
        attempted_violations:
          type: integer
          minimum: 0
