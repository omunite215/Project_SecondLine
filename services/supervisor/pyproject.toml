[project]
name = "sl-supervisor"
version = "0.0.0"
description = "Async supervisor: detective invariants and halts"
requires-python = ">=3.12,<3.13"
dependencies = ["sl-contracts"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sl_supervisor"]
