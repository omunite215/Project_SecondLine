name: claude-review
# Optional AI first-pass review (uses Om's Claude usage). Runs only when Om adds the `ai-review` label.
# Setup: docs/setup/GITHUB.md §5 (Claude GitHub App + secret CLAUDE_CODE_OAUTH_TOKEN).
# pull_request_target: this file and its label check come from protected main, so a PR can't edit them.
# The token is a secret of environment `claude-review`, whose deployment-branch policy allows only main,
# so a workflow added on a PR branch can't read it. Agent mode (prompt input) never checks out the PR head,
# and the action restores .claude/ + CLAUDE.md from base. CLAUDE.md imports docs/ai/CLAUDE.md, which comes from
# the same base checkout, so a PR still cannot inject instructions. Never add `ref:` to the checkout below.
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
jobs:
  review:
    if: >-
      github.event.label.name == 'ai-review' && github.event.sender.login == 'omunite215' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: claude-review
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
