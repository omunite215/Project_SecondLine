version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
  - package-ecosystem: docker
    directory: "/services/ledger"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/services/gateway"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/infra/compose"
    schedule:
      interval: weekly
# KG-01 adds uv; OM-21 adds npm. tests/kit enforces coverage.
