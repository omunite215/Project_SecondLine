spring:
  application:
    name: ledger
  # The running ledger never migrates: it connects as ledger_svc (DML only). Flyway runs in the
  # one-shot ledger-migrate service as ledger_migrator (profile `migrate`, ADR-019).
  flyway:
    enabled: false
server:
  port: 8081
# OM-07 realms. No defaults: unset is a startup failure. The key file is the PUBLIC half of the gateway's service key.
ledger:
  auth:
    gateway-jwk-path: ${LEDGER_GATEWAY_JWK_PATH:}
    operator-token: ${LEDGER_OPERATOR_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
